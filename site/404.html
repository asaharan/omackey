<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Omackey</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{--paper:#eef1f6;--ink:#1c2238;--muted:#5b6379;--line:#ccd3e0;--coral:#df7358;--coral-deep:#b04d36;--keycap:#fdfdff;--keycap-edge:#c7cee0;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif}
  .wrap{width:min(560px,calc(100% - 64px));margin-inline:auto;padding-block:60px}
  .mark{display:flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--muted);margin:0 0 40px}
  .key{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid var(--keycap-edge);border-bottom-width:3px;border-radius:6px;background:linear-gradient(180deg,var(--keycap),#eef1f8);font-size:14px;color:var(--ink)}
  h1{font-family:'IBM Plex Mono',monospace;font-size:clamp(28px,4.5vw,36px);font-weight:500;letter-spacing:-.5px;line-height:1.3;margin:0 0 16px}
  p{font-size:16px;line-height:1.7;color:var(--muted);margin:0 0 32px;max-width:44ch}
  .chord{display:flex;gap:6px;margin:0 0 32px}
  kbd{font-family:'IBM Plex Mono',monospace;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 9px;border:1px solid var(--keycap-edge);border-bottom-width:3px;border-radius:6px;background:linear-gradient(180deg,var(--keycap),#eef1f8);font-size:13px;color:var(--ink)}
  a.button{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:8px;background:var(--coral-deep);color:#f7f8fc;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;text-decoration:none}
  a.button:hover{background:#8a3a27}
  a.button:focus-visible{outline:3px solid var(--coral-deep);outline-offset:4px}
</style>
</head>
<body>
  <div class="wrap">
    <p class="mark"><span class="key">⌘</span> omackey</p>
    <div class="chord" aria-hidden="true"><kbd>⌘</kbd><kbd>404</kbd></div>
    <h1>This shortcut leads nowhere.</h1>
    <p>The page you're looking for isn't here. It may have moved, or the link was mistyped.</p>
    <a class="button" href="https://omackey.saharan.dev/">Back to Omackey</a>
  </div>
</body>
</html>
